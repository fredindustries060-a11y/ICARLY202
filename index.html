<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICARLY2026</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #8e24aa;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 15px;
    }

    .welcome {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }

    .welcome h2 {
      color: #8e24aa;
    }

    button {
      background: #8e24aa;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #6a1b7b;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #777;
    }
  </style>
</head>

  <header>
    <h1>ICARLY2026</h1>
    <p>Connect • Share • Discover</p>
  </header>

  <div class="container">

    <div class="welcome">
      <h2>Welcome to ICARLY2026!</h2>
      <p>Your new social platform starts here.</p>
      <button onclick="alert('Welcome to ICARLY2026!')">

      <p>© 2026 ICARLY2026</p>
    </footer>
